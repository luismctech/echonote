# -----------------------------------------------------------------------------
# EchoNote — Continuous Integration
# -----------------------------------------------------------------------------
# Runs on every push and PR. Parallel jobs:
#
#   1. fmt       — rustfmt --check (fast, fails early)
#   2. macos     — full pipeline: clippy + tests + build on Apple Silicon
#   3. linux     — `cargo check` only, to catch platform-specific drift early
#   4. audit     — cargo audit + pnpm audit
#   5. cargo-deny — supply-chain policy (deny.toml): advisories, bans, licenses, sources
#
# Phase 0 runs macOS-only as the primary dev target. Linux and Windows get
# full pipelines in Phase 1 (weeks 12-15).
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # fmt — formatting check only, gate for everything else.
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install toolchain (honors rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: cargo fmt --check
      run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # macos — primary platform for Phase 0. Full clippy + tests + build.
  # Also builds the frontend and the Tauri shell crate end to end.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    needs: fmt
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install toolchain (honors rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    # Cargo.toml optimizes third-party crates in the dev profile so that
    # `pnpm tauri dev` keeps up with live audio. CI only needs the tests
    # to pass: compiling every dependency optimized pushed this job from
    # ~4 to 17-30 minutes. A Cargo config profile overrides Cargo.toml.
    - name: Build dependencies unoptimized (CI only)
      run: printf '[profile.dev.package."*"]\nopt-level = 0\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: macos-14

    - name: Setup pnpm (version from packageManager field)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 22
        check-latest: true
        cache: pnpm

    - name: pnpm install (frozen lockfile)
      run: pnpm install --frozen-lockfile

    - name: pnpm typecheck
      run: pnpm typecheck

    - name: pnpm lint (Biome, lint only)
      run: pnpm lint

    - name: pnpm test (vitest)
      # The frontend now has reducer + hook tests under src/. They
      # run in node (no jsdom) and finish in well under a second, so
      # there's no reason not to gate macOS CI on them.
      run: pnpm test

    - name: pnpm build (Vite production bundle)
      run: pnpm build

    - name: Build MCP sidecar (required by Tauri externalBin)
      run: bash scripts/build-mcp-sidecar.sh dev

    - name: cargo clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    # screencapturekit crate links Swift Concurrency. On GH runners the
    # dylib lives inside the Xcode toolchain, not in the dyld shared cache.
    - name: Resolve Swift runtime path
      id: swift
      run: echo "lib_dir=$(dirname $(xcrun --toolchain default -f swiftc))/../lib/swift/macosx" >> "$GITHUB_OUTPUT"

    - name: cargo test
      env:
        DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift:${{ steps.swift.outputs.lib_dir }}
      run: cargo test --workspace --all-targets --locked

    - name: cargo build (dev profile)
      run: cargo build --workspace --locked

    - name: cargo run echo-proto --help (smoke test)
      env:
        DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift:${{ steps.swift.outputs.lib_dir }}
      run: cargo run --locked -p echo-proto -- --help

  # ---------------------------------------------------------------------------
  # linux — cross-platform drift guard. Cheap `cargo check` so Linux-specific
  # regressions (missing cfg gates, wrong target attrs) are caught day one.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (cargo check)
    runs-on: ubuntu-24.04
    needs: fmt
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install system dependencies (Tauri + ALSA + cmake/clang for whisper.cpp)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libasound2-dev \
          cmake \
          clang \
          libclang-dev \
          patchelf \
          pkg-config

    - name: Install toolchain (honors rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ubuntu-24.04

    - name: Setup pnpm (version from packageManager field)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 22
        check-latest: true
        cache: pnpm

    - name: pnpm install (frozen lockfile)
      run: pnpm install --frozen-lockfile

    - name: pnpm build (needed so src-tauri can resolve ../dist)
      run: pnpm build

    - name: Build MCP sidecar (required by Tauri externalBin)
      run: bash scripts/build-mcp-sidecar.sh dev

    - name: cargo check
      run: cargo check --workspace --all-targets --locked

  # ---------------------------------------------------------------------------
  # audit — security vulnerability scan for Rust + npm dependencies.
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: cargo audit (Rust)
      run: |
        cargo install cargo-audit --locked
        cargo audit

    - name: Setup pnpm (version from packageManager field)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 22
        check-latest: true
        cache: pnpm

    - name: pnpm install (frozen lockfile)
      run: pnpm install --frozen-lockfile

    - name: pnpm audit
      run: pnpm audit --prod || true

  # ---------------------------------------------------------------------------
  # cargo-deny — supply-chain policy from deny.toml (advisories, bans,
  # licenses, sources). Runs on its own; does not need a build.
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: cargo deny check
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      env:
        # .cargo/config.toml routes rustc through sccache, which the action
        # container lacks; cargo-deny only reads metadata, so drop the wrapper.
        RUSTC_WRAPPER: ""
      with:
        # The action image ships an older Rust; rust-toolchain.toml pins 1.99.0,
        # so cargo metadata fails unless the container installs that version.
        rust-version: "1.99.0"
        command: check advisories bans licenses sources
