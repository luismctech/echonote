# =============================================================================
# cargo-audit advisory ignore list
# =============================================================================
# All entries are TRANSITIVE dependencies from Tauri 2.x that we cannot
# upgrade directly. Reviewed: 2026-11-27 against Cargo.lock and the RustSec
# database (entries whose crate left the lock, was patched or whose advisory
# was withdrawn were removed, so they cannot mute a future regression).
# Re-evaluate when upgrading Tauri major versions.
# =============================================================================

[advisories]
ignore = [
    # ── Unmaintained: transitive Tauri deps ──────────────────────────────────
    "RUSTSEC-2024-0370", # proc-macro-error 1.0.4
    "RUSTSEC-2024-0436", # paste 1.0.15

    # ── Unsound ──────────────────────────────────────────────────────────────
    # glib 0.18.5 — VariantStrIter iterator unsoundness (GTK3, Linux only);
    # patched in glib >= 0.20, which Tauri's GTK3 stack does not use yet.
    "RUSTSEC-2024-0429",
]

# Warn (but don't fail) on unmaintained crates not in the ignore list
informational_warnings = ["unmaintained", "unsound"]
